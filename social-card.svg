 <text x="80" y="140" font-family="system-ui, sans-serif" font-size="72" font-weight="bold" fill="white">VPS</text>
 <text x="80" y="210" font-family="system-ui, sans-serif" font-size="36" fill="url(#accent)">Visual Positioning System</text>
