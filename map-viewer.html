<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>VPS 3D Map Viewer</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a1a; color: #fff; }
		#viewer { width: 100vw; height: 100vh; }
		#controls { position: absolute; top: 20px; left: 20px; background: rgba(10,10,26,0.9); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
		#controls h2 { font-size: 1.2em; margin-bottom: 12px; color: #00d4ff; }
		#controls label { display: block; margin: 8px 0; font-size: 0.9em; }
		#controls input[type="file"] { margin: 8px 0; }
		#controls button { background: #00d4ff; color: #000; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
		#controls button:hover { background: #7b2fff; color: #fff; }
		#info { position: absolute; bottom: 20px; left: 20px; background: rgba(10,10,26,0.9); padding: 12px 16px; border-radius: 8px; font-size: 0.85em; color: #888; }
		#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; color: #00d4ff; }
	</style>
</head>
<body>
	<div id="viewer"></div>
	<div id="controls">
		<h2>VPS Map Viewer</h2>
		<label>
			Load .vpsmap file:
			<input type="file" id="mapFile" accept=".vpsmap">
		</label>
		<button id="loadBtn">Load Map</button>
		<div style="margin-top: 12px; font-size: 0.85em; color: #888;">
			<div>Keyframes: <span id="kfCount">0</span></div>
			<div>Points: <span id="ptCount">0</span></div>
			<div>FPS: <span id="fps">0</span></div>
		</div>
	</div>
	<div id="info">Drag to rotate | Scroll to zoom | Right-drag to pan</div>
	<div id="loading">Loading...</div>

	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
		}
	}
	</script>

	<script type="module">
		import * as THREE from 'three';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

		// Scene setup
		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x0a0a1a);

		const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
		camera.position.set(5, 5, 5);

		const renderer = new THREE.WebGLRenderer({ antialias: true });
		renderer.setSize(window.innerWidth, window.innerHeight);
		document.getElementById('viewer').appendChild(renderer.domElement);

		const controls = new OrbitControls(camera, renderer.domElement);
		controls.enableDamping = true;

		// Grid
		const grid = new THREE.GridHelper(20, 20, 0x333366, 0x222244);
		scene.add(grid);

		// Axes
		const axes = new THREE.AxesHelper(2);
		scene.add(axes);

		// Point cloud
		let pointsMesh = null;
		let keyframeMeshes = [];

		document.getElementById('loadBtn').addEventListener('click', () => {
			const file = document.getElementById('mapFile').files[0];
			if (!file) return;

			const reader = new FileReader();
			reader.onload = (e) => {
				try {
					const data = JSON.parse(e.target.result);
					loadMap(data);
				} catch (err) {
					alert('Invalid .vpsmap file: ' + err.message);
				}
			};
			reader.readAsText(file);
		});

		function loadMap(data) {
			// Clear previous
			if (pointsMesh) scene.remove(pointsMesh);
			keyframeMeshes.forEach(m => scene.remove(m));
			keyframeMeshes = [];

			// Load keyframes as points
			const positions = [];
			const colors = [];

			for (const kf of data.keyframes) {
				// Keyframe position
				if (kf.pose && kf.pose.t) {
					positions.push(kf.pose.t[0], kf.pose.t[1], kf.pose.t[2]);
					colors.push(1.0, 0.0, 0.0); // red for keyframes
				}

				// 3D points from keypoints (simplified)
				if (kf.keypoints && kf.keypoints.length > 0) {
					for (let i = 0; i < Math.min(kf.keypoints.length, 50); i++) {
						const kp = kf.keypoints[i];
						positions.push(kp[0] / 100, kp[1] / 100, (i % 10) / 10);
						colors.push(0.0, 0.83, 1.0); // cyan
					}
				}
			}

			if (positions.length > 0) {
				const geom = new THREE.BufferGeometry();
				geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
				geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

				const mat = new THREE.PointsMaterial({ size: 0.05, vertexColors: true });
				pointsMesh = new THREE.Points(geom, mat);
				scene.add(pointsMesh);
			}

			// Update stats
			document.getElementById('kfCount').textContent = data.num_keyframes || 0;
			document.getElementById('ptCount').textContent = positions.length;
		}

		// FPS counter
		let lastTime = performance.now();
		let frameCount = 0;
		function updateFPS() {
			frameCount++;
			const now = performance.now();
			if (now - lastTime >= 1000) {
				document.getElementById('fps').textContent = frameCount;
				frameCount = 0;
				lastTime = now;
			}
			requestAnimationFrame(updateFPS);
		}
		updateFPS();

		// Resize
		window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		});

		// Animate
		function animate() {
			requestAnimationFrame(animate);
			controls.update();
			renderer.render(scene, camera);
		}
		animate();

		// Demo data
		const demoData = {
			version: '7.0.0',
			num_keyframes: 10,
			keyframes: Array.from({ length: 10 }, (_, i) => ({
				id: i,
				pose: { t: [i * 0.5, Math.sin(i) * 0.3, Math.cos(i) * 0.3] },
				keypoints: Array.from({ length: 50 }, (_, j) => [j * 2, j * 2, j * 0.1])
			}))
		};
		loadMap(demoData);
	</script>
</body>
</html>
